import org.jetbrains.kotlin.gradle.dsl.JvmTarget

buildscript {
    ext {
        restdocsApiSpecVersion = '0.20.1'
        profile = (!project.hasProperty('profile') || !profile) ? 'none' : profile
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.epages.restdocs-api-spec' version "${restdocsApiSpecVersion}"
    id 'org.hidetake.swagger.generator' version '2.19.2'
    id 'org.jetbrains.kotlin.jvm'
    id "org.jetbrains.kotlin.plugin.spring"
    id "org.jetbrains.kotlin.plugin.jpa"
    id "org.jetbrains.kotlin.plugin.allopen"
}

group = 'sharev'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'com.google.cloud:spring-cloud-gcp-dependencies:8.2.4'
    }
    dependencies {
        // GCP BOM이 Boot가 관리하는 3.0.0(Jakarta EE 11)을 2.1.1로 덮어쓰므로 Boot 버전으로 고정한다.
        dependency 'jakarta.annotation:jakarta.annotation-api:3.0.0'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'org.springframework.boot:spring-boot-starter-validation'
    testRuntimeOnly 'com.h2database:h2'

    // testcontainers
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'

    // docker compose
    if ("${profile}" != 'dev') {
        runtimeOnly 'org.springframework.boot:spring-boot-docker-compose'
    }

    // swagger
    testImplementation 'org.springframework.boot:spring-boot-starter-restdocs'
    testImplementation "org.springframework.restdocs:spring-restdocs-mockmvc"
    testImplementation "com.epages:restdocs-api-spec-mockmvc:${restdocsApiSpecVersion}"
    swaggerUI 'org.webjars:swagger-ui:5.15.1'

    // production
    implementation 'com.google.cloud:spring-cloud-gcp-starter-sql-mysql'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'

    // actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // embedded redis
    implementation 'com.github.codemonstur:embedded-redis:1.4.3'

    // logging
    if ("${profile}" == 'prod') {
        implementation 'com.google.cloud:spring-cloud-gcp-starter'
    }

    // kotlin
    implementation "tools.jackson.module:jackson-module-kotlin"
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
    implementation "org.jetbrains.kotlin:kotlin-reflect"

    // jooq
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
        freeCompilerArgs.addAll(['-Xjsr305=strict'])
    }
}

allOpen {
    annotation("jakarta.persistence.Entity")
    annotation("jakarta.persistence.MappedSuperclass")
    annotation("jakarta.persistence.Embeddable")
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
    }
}

// === swagger start ===

openapi3 {
    server = "http://localhost:8080"
    title = "share:v API"
    description = "share:v API description"
    version = "0.1.0"
    format = "json"
}

swaggerSources {
    sample {
        setInputFile(file("${openapi3.outputDirectory}/openapi3.json"))
    }
}

tasks.register("copySwaggerUISample") {
    dependsOn generateSwaggerUISample
    doLast {
        copy {
            from("${generateSwaggerUISample.outputDir}")
            into("${layout.buildDirectory.dir("resources/main/static/docs/").get()}")
        }
    }
}

tasks.withType(GenerateSwaggerUI).configureEach {
    dependsOn "openapi3"
    finalizedBy copySwaggerUISample
}

bootJar {
    if ("${profile}" != 'prod') {
        dependsOn copySwaggerUISample
    }
}

bootRun {
    if ("${profile}" != 'prod') {
        dependsOn copySwaggerUISample
    }
}

// === swagger end ===
